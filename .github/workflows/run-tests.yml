name: PHPUnit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*', testbench: '^10.0', cockroachdb: v26.2.6 }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0', cockroachdb: v25.4.17 }
          - { php: '8.3', laravel: '13.*', testbench: '^11.0', cockroachdb: v25.4.17 }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', cockroachdb: v26.2.6 }

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - crdb.${{ matrix.cockroachdb }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run CockroachDB Service
        run: docker compose up -d
        env:
          VERSION: ${{ matrix.cockroachdb }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Require Laravel Version
        run: >
          composer require --dev --no-update --no-interaction
          "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"

      # composer update, so the lock file does not override the Laravel version above.
      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Wait for CockroachDB
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("pgsql:host=127.0.0.1;port=26257;dbname=defaultdb", "root", "");' 2>/dev/null && exit 0
            sleep 2
          done
          docker compose logs --tail 100
          exit 1

      - name: Configure Database
        run: php ./database.php

      - name: Execute tests
        run: vendor/bin/pest
