name: Coverage

on:
  push:
    branches: [ main, custom ]
  pull_request:

jobs:
  generate-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run CockroachDB Service
        run: docker compose up -d
        env:
          VERSION: v26.2.6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql
          tools: composer:v2
          coverage: pcov

      - uses: ramsey/composer-install@v4

      - name: Wait for CockroachDB
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("pgsql:host=127.0.0.1;port=26257;dbname=defaultdb", "root", "");' 2>/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Configure Database
        run: php ./database.php

      - name: Execute tests
        run: vendor/bin/pest

      - uses: codecov/codecov-action@v6
        with:
          files: ./build/logs/clover.xml
